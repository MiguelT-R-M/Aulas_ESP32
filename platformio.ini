; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

; Monitor speed
monitor_speed = 115200

; Enable PSRAM and set flash mode for 16MB Flash / 8MB PSRAM (N16R8)
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0  ; Keeps serial output clean on the hardware UART bridge
    -DBOARD_HAS_PSRAM            ; Explicitly tells the build system PSRAM is available

; Use official dependable ESP32 camera library source if needed, 
; or PlatformIO will pull dependencies automatically.
lib_deps = 
    https://github.com/adafruit/dht-sensor-library
    https://github.com/johnrickman/LiquidCrystal_I2C
    